<!DOCTYPE html>
<html lang="en" >

<head>
  <meta charset="UTF-8">
  <title>Helpers Exercise 2</title>
</head>
<body>

<div id="output"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
<script id = "exercise2" type = "text/x-handlebars-template">

  <p>{{name}} on {{date}} <br>
  {{{comment}}}</p>
  

  {{#if social}}
  <strong>Social Media</strong>
  <ul>
  {{#each social}}
  <li>{{site}} : {{name}}</li>
  {{/each}}
  </ul>
  {{else}}
  <strong>No Social Media</strong>
  {{/if}}

</script>

<script>
const data = {
  name: "Jack",
  date: "12/03/25",
  comment: "This is a really <strong>awesome</strong> tutorial. Thanks.",
  social: [
    {
      site: "Twitter",
      name: "Jack_Franklin"
    },
    {
      site: "Github",
      name: "jackfranklin"
    }
  ]
}

let template = Handlebars.compile(document.querySelector('#exercise2').innerHTML);

let rendered = template(data);

document.querySelector('#output').innerHTML = rendered;

</script>
</body>
</html>
